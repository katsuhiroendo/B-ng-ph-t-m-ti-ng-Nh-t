<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Bảng hiragana và katakana cho người Việt: bấm từng chữ để nghe phát âm tiếng Nhật.">
<title>Bảng Hiragana Phát Âm</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;600;700&family=Klee+One:wght@600&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
body{margin:0}
/* Layout: sticky "sân khấu" (big kana + hint) beside a tabbed kana grid; stacks on phones */
:root{
  --bg:#fbf5f3; --surface:#ffffff; --surface-2:#f6eeec; --ink:#1f2a27; --muted:#5f6c67; --line:#eadcd9;
  --leaf:#1d6b55; --leaf-soft:#e2f1ea;
  --lotus:#c93d66; --lotus-soft:#fbe4eb;
  --river:#22678f; --river-soft:#e1eef6;
  --gold:#9a6512; --gold-soft:#f8ecd6;
  --plum:#7a4a9e; --plum-soft:#efe5f6;
  --star:#c93d66;
  --font-kana:"Klee One","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --font-ui:"Be Vietnam Pro","Noto Sans Thai",system-ui,-apple-system,"Segoe UI","Hiragino Sans","Yu Gothic UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141a19; --surface:#1c2422; --surface-2:#232d2a; --ink:#ecf1ef; --muted:#a3b0ab; --line:#33403c;
  --leaf:#5fc7a2; --leaf-soft:#1d3a31;
  --lotus:#f2829f; --lotus-soft:#432230;
  --river:#7cbde3; --river-soft:#1c3443;
  --gold:#e6b45e; --gold-soft:#3d301a;
  --plum:#c3a0e6; --plum-soft:#33284a;
  --star:#f2829f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a19; --surface:#1c2422; --surface-2:#232d2a; --ink:#ecf1ef; --muted:#a3b0ab; --line:#33403c;
  --leaf:#5fc7a2; --leaf-soft:#1d3a31;
  --lotus:#f2829f; --lotus-soft:#432230;
  --river:#7cbde3; --river-soft:#1c3443;
  --gold:#e6b45e; --gold-soft:#3d301a;
  --plum:#c3a0e6; --plum-soft:#33284a;
  --star:#f2829f; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{margin:0;font-size:clamp(1.5rem,3.4vw,2.2rem);line-height:1.15;text-wrap:balance;font-weight:700}
h1 .jp{font-family:var(--font-kana);color:var(--lotus);margin-right:.35em}
.sub{margin:4px 0 0;color:var(--muted);max-width:60ch}
.hdr-right{display:grid;gap:6px;justify-items:end}
@media (max-width:600px){.hdr-right{justify-items:start}}
.langsel{display:flex;align-items:center;gap:8px;font-size:.8rem;font-weight:600;color:var(--muted)}
.langsel select{font-size:.9rem}
html:lang(th) body{line-height:1.65}
html:lang(th) .controls label,html:lang(ja) .controls label,html:lang(th) .note h3,html:lang(ja) .note h3{letter-spacing:0}
.progress{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.progress b{color:var(--leaf)}

.controls{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.controls label{font-size:.8rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;display:flex;align-items:center;gap:8px}
select,input[type=range]{font:inherit;color:var(--ink)}
select{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 8px;max-width:260px;text-transform:none;letter-spacing:0;font-weight:500;font-size:.9rem}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button[lang=ja]{font-family:var(--font-kana);font-size:.95rem}
.seg button{border:0;background:transparent;color:var(--ink);font:inherit;font-size:.85rem;padding:6px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--leaf);color:var(--surface)}
.warn{flex-basis:100%;margin:0;font-size:.85rem;color:var(--lotus);background:var(--lotus-soft);border-radius:8px;padding:8px 10px}

.main{display:grid;grid-template-columns:320px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.main{grid-template-columns:minmax(0,1fr)}}

/* Stage */
.stage{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;display:grid;gap:12px;text-align:center}
@media (max-width:860px){.stage{position:static;grid-template-columns:auto 1fr;text-align:left;align-items:center;padding:14px 16px}}
.big{font-family:var(--font-kana);font-size:clamp(4rem,10vw,7rem);line-height:1;color:var(--ink);margin:0;min-height:1em}
.big.say{animation:pop .35s ease-out}
/* Words: shrink to fit the stage width (one em per letter), wrap at the space in phrases */
.stage{container-type:inline-size}
.stage>*,.meta{min-width:0}
.big.word{grid-column:1/-1;font-size:2.4rem;font-size:clamp(1.5rem,calc((100cqi - 12px) / var(--n,4)),4.2rem);line-height:1.3;padding-block:.15em}
.big.word .acc{flex-wrap:wrap;justify-content:center;row-gap:.25em}
@media (max-width:860px){.big.word .acc{justify-content:flex-start}}
.big.word .acc .mo{border-width:3px}
@keyframes pop{0%{transform:scale(.88);color:var(--lotus)}100%{transform:scale(1)}}
.meta{display:grid;gap:6px}
.hint{font-size:1.6rem;font-weight:700;color:var(--lotus)}
.romaji{color:var(--muted);font-size:.9rem}
.src{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--leaf);font-weight:600}
.src:empty{display:none}
.tip{overflow-wrap:anywhere;font-size:.9rem;background:var(--surface-2);border-radius:10px;padding:8px 10px;text-align:left}
.tip:empty{display:none}
.replay{justify-self:center;font:inherit;font-weight:600;background:var(--lotus);color:var(--surface);border:0;border-radius:999px;padding:9px 18px;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
@media (max-width:860px){.replay{justify-self:start}}
.replay svg{width:16px;height:16px;fill:currentColor}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
@media (max-width:860px){.actions{justify-content:flex-start}}
.illbtn{font:inherit;font-weight:600;background:var(--surface-2);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.illbtn:hover{border-color:var(--leaf);color:var(--leaf)}
.illbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* Illustration card viewer */
.ill{position:fixed;inset:0;z-index:50;margin:0;border:0;padding:0;width:100%;height:100%;max-width:none;max-height:none;background:transparent;color:var(--ink)}
.ill::backdrop{background:rgb(10 14 13 / .82)}
.ill[open]{display:grid;place-items:center}
.ill-box{width:min(1100px,100% - 32px);max-height:calc(100% - 32px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:grid;gap:12px;background:var(--surface);border-radius:18px;padding:14px;box-shadow:0 20px 60px rgb(0 0 0 / .35);overflow:auto}
.ill-img{display:block;width:100%;height:auto;max-height:56vh;object-fit:contain;border-radius:12px;background:#fff}
.ill-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.ill-cap{display:flex;gap:12px;align-items:baseline;min-width:0}
.ill-cap .kk{font-family:var(--font-kana);font-size:1.8rem;line-height:1}
.ill-cap .ty{font-size:.8rem;font-weight:600;color:var(--leaf);letter-spacing:.04em}
.ill-note{display:grid;gap:6px;font-size:.92rem;line-height:1.6;background:var(--surface-2);border-radius:12px;padding:12px 14px;max-width:80ch}
.ill-note:empty{display:none}
.ill-note p{margin:0}
.ill-note b{color:var(--ink)}
.ill-note .ill-type{font-size:1rem;color:var(--leaf)}
.ill-note .ill-type b{color:var(--leaf);font-size:1.1rem;margin-right:.3em}
.ill-note .ill-prac{border-top:1px dashed var(--line);padding-top:6px}
.ill-note .ill-extra{color:var(--muted);font-size:.85rem}
.ill-x{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:999px;padding:8px 16px;cursor:pointer}

/* Tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab{font:inherit;font-weight:600;font-size:.92rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:999px;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.tab .jp{font-family:var(--font-kana);font-size:1.05rem}
.tab[aria-selected="true"]{background:var(--c);border-color:var(--c);color:var(--surface)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;overflow-x:auto}

.grid{display:grid;gap:6px;grid-template-columns:40px repeat(var(--cols),minmax(58px,1fr));min-width:0}
.colhead{font-weight:700;color:var(--c);text-align:center;font-size:.85rem;padding:2px 0;text-transform:lowercase}
.rowplay{border:0;background:transparent;color:var(--muted);cursor:pointer;border-radius:8px;display:grid;place-items:center}
.rowplay:hover{color:var(--c);background:var(--soft)}
.rowplay svg{width:18px;height:18px;fill:currentColor}
.k{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:8px 2px 6px;cursor:pointer;display:grid;justify-items:center;gap:1px;position:relative;transition:transform .12s,background .12s,border-color .12s}
.k:hover{background:var(--soft);border-color:var(--c)}
.k:active{transform:scale(.95)}
.k .kk{font-family:var(--font-kana);font-size:clamp(1.5rem,3vw,2rem);line-height:1.15}
.k .vi{font-size:.85rem;font-weight:600;color:var(--c)}
.k .ro{font-size:.7rem;color:var(--muted)}
.k.heard::after{content:"";position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--c);opacity:.55}
.k.on{background:var(--c);border-color:var(--c)}
.k.on .kk,.k.on .vi,.k.on .ro{color:var(--surface)}
.empty{border:1px dashed var(--line);border-radius:12px}
.gnote{margin:0 0 12px;font-size:.88rem;color:var(--muted);background:var(--soft);border-radius:10px;padding:8px 12px;max-width:70ch}
.gnote b{color:var(--c)}
.hide-ro .ro{display:none}
.hide-vi .vi{display:none}
.star{color:var(--star)}
.k.on .star{color:var(--surface)}

/* Special */
.special{display:grid;gap:10px}
.sp{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:12px}
@media (max-width:520px){.sp{grid-template-columns:minmax(0,1fr)}}
.sp .mark{font-family:var(--font-kana);font-size:1.6rem;color:var(--c)}
.sp p{margin:0 0 8px;font-size:.92rem}
.ex{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:10px;padding:6px 10px;cursor:pointer;display:inline-flex;gap:8px;align-items:baseline}
.chip:hover{border-color:var(--c);background:var(--soft)}
.chip .jp{font-family:var(--font-kana);font-size:1.15rem}
/* pitch line: top border = high, bottom border = low, side border = change */
.acc{display:inline-flex;align-items:stretch}
.acc .mo{padding:2px .04em;border-color:var(--c,var(--lotus))}
.acc .hi{border-top:2px solid}
.acc .lo{border-bottom:2px solid}
.acc .turn{border-left:2px solid}
.acc .aw{display:inline-flex;white-space:nowrap}
.acc{column-gap:.45em}
.big .acc .mo{border-width:4px;padding:4px .03em}
.sp-head{margin:0 0 12px;font-size:.88rem;color:var(--muted);background:var(--soft);border-radius:10px;padding:8px 12px;max-width:70ch;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.sp-head .acc{font-family:var(--font-kana);font-size:1.2rem;color:var(--ink)}
.chip small{color:var(--muted)}

/* Notes */
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.note{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:.88rem}
.note h3{margin:0 0 6px;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--leaf)}
.note p{margin:0}
:focus-visible{outline:3px solid var(--river);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div>
      <h1><span class="jp" id="h1jp">ひらがな</span><span id="h1t">Bảng phát âm tiếng Nhật</span></h1>
      <p class="sub" id="sub">Bấm vào từng chữ để nghe giọng Nhật chuẩn. Phần chữ Việt chỉ là gợi âm gần đúng, đọc không thêm thanh điệu.</p>
    </div>
    <div class="hdr-right">
      <label class="langsel" for="lang"><span data-i18n="lang">Ngôn ngữ</span> <select id="lang"></select></label>
      <div class="progress" id="progress">Đã nghe <b>0</b> / 0 chữ</div>
    </div>
  </header>

  <div class="controls">
    <label><span data-i18n="script">Chữ</span>
      <span class="seg" id="script">
        <button type="button" data-s="hira" aria-pressed="true" lang="ja">ひらがな</button>
        <button type="button" data-s="kata" aria-pressed="false" lang="ja">カタカナ</button>
      </span>
    </label>
    <label for="voice"><span data-i18n="voice">Giọng đọc</span> <select id="voice"><option data-i18n="loading">Đang tải giọng…</option></select></label>
    <label><span data-i18n="speed">Tốc độ</span>
      <span class="seg" id="speed">
        <button type="button" data-rate="0.6" aria-pressed="false" data-i18n="slow">Chậm</button>
        <button type="button" data-rate="0.85" aria-pressed="true" data-i18n="mid">Vừa</button>
        <button type="button" data-rate="1" aria-pressed="false" data-i18n="normal">Bình thường</button>
      </span>
    </label>
    <label><span data-i18n="show">Hiện</span>
      <span class="seg" id="show">
        <button type="button" data-k="vi" aria-pressed="true" data-i18n="hint">Gợi âm Việt</button>
        <button type="button" data-k="ro" aria-pressed="true" data-i18n="romaji">Romaji</button>
        <button type="button" data-k="ill" aria-pressed="true" data-i18n="autoIll">Tự hiện thẻ minh họa</button>
      </span>
    </label>
    <p class="warn" id="warn" hidden></p>
  </div>

  <div class="main">
    <aside class="stage" aria-live="polite">
      <p class="big" id="big">あ</p>
      <div class="meta">
        <div class="hint" id="hint">a</div>
        <div class="romaji" id="ro">romaji: a</div>
        <div class="src" id="src"></div>
        <div class="tip" id="tip"></div>
        <div class="actions">
        <button class="replay" id="replay" type="button"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/></svg><span data-i18n="replay">Nghe lại</span></button>
        <button class="illbtn" id="illbtn" type="button" hidden><svg viewBox="0 0 24 24"><path d="M4 9a8 5 0 0 1 16 0c0 3-3.6 6-8 6s-8-3-8-6z"/><path d="M8 10.5c1.2 1 2.5 1.5 4 1.5s2.8-.5 4-1.5"/></svg><span id="illlbl"></span></button>
        </div>
      </div>
    </aside>

    <section>
      <div class="tabs" role="tablist" id="tabs"></div>
      <div class="panel" id="panel"></div>
    </section>
  </div>

  <div class="notes" id="notes"></div>
  <dialog class="ill" id="ill" aria-labelledby="illkk">
    <div class="ill-box">
      <img class="ill-img" id="illimg" alt="">
      <div class="ill-bar">
        <div class="ill-cap"><span class="kk" id="illkk" lang="ja"></span><span class="ty" id="illty"></span></div>
        <div class="actions">
          <button class="replay" id="illplay" type="button"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/></svg><span data-i18n="replay">Nghe lại</span></button>
          <button class="ill-x" id="illx" type="button" data-i18n="close">Đóng</button>
        </div>
      </div>
      <div class="ill-note" id="illnote"></div>
    </div>
  </dialog>
</div>

<script>
const ICON_PLAY='<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
const TIPS={
 "xi":"Âm gió mềm, gần “si” nhưng lưỡi chạm nhẹ phía trước, không phải “xi” cứng.",
 "xa":"Âm gió mềm như “sh” nhẹ.", "xư":"Âm gió mềm như “sh” nhẹ.", "xô":"Âm gió mềm như “sh” nhẹ.",
 "chi":"Không bật hơi mạnh như “chi” tiếng Việt; đọc nhẹ, gần “tri” không cong lưỡi.",
 "cha":"Không bật hơi mạnh.","chư":"Không bật hơi mạnh.","chô":"Không bật hơi mạnh.",
 "tsư":"ts = t + x đọc liền thành một nhịp; không đọc thành “ch”.",
 "hi":"Hơi đi qua phần trước lưỡi, gần âm “khi” rất nhẹ.",
 "phư":"Thổi nhẹ bằng hai môi, không dùng răng chạm môi như “ph” tiếng Việt.",
 "r":"Bật lưỡi nhẹ một lần lên vòm miệng, âm nằm giữa r, l và đ.",
 "n":"Âm mũi một nhịp riêng; thay đổi theo âm đứng sau (m, n hoặc ng).",
 "v":"Âm v: người Nhật thường đọc gần như “b”; đọc “v” nhẹ cũng được hiểu.",
 "ph":"Âm f: thổi nhẹ bằng hai môi, không chạm răng vào môi như “ph” tiếng Việt.",
 "ts":"ts = t + x đọc liền thành một nhịp; không đọc thành “ch”.",
 "ch":"Không bật hơi mạnh; đọc nhẹ, gần “tr” không cong lưỡi.",
 "x":"Âm gió mềm như “sh” nhẹ.",
 "dz":"dz đọc liền, không tách thành hai âm.","dj":"dj đọc liền thành một âm và có rung dây thanh; không đọc thành “gi” hay “d” tiếng Việt."
};
function tipFor(vi,ro){
  if(!vi.endsWith("*")) return "";
  if(LANG!=="vi") return (T("tips")||{})[tipKey(ro)]||"";
  const b=vi.slice(0,-1);
  if(TIPS[b]) return TIPS[b];
  if(b.startsWith("r")) return TIPS.r;
  if(b.startsWith("dz")) return TIPS.dz;
  if(b.startsWith("dj")) return TIPS.dj;
  if(b==="n") return TIPS.n;
  if(b.startsWith("ph")) return TIPS.ph;
  if(b.startsWith("ts")) return TIPS.ts;
  if(b.startsWith("ch")) return TIPS.ch;
  if(b.startsWith("v")) return TIPS.v;
  if(b.startsWith("x")) return TIPS.x;
  return "";
}
// [kana, gợi âm Việt, romaji]
const BASIC={cols:["a","i","u","e","o"],rows:[
 [["あ","a","a"],["い","i","i"],["う","ư","u"],["え","ê","e"],["お","ô","o"]],
 [["か","ca","ka"],["き","ki","ki"],["く","cư","ku"],["け","kê","ke"],["こ","cô","ko"]],
 [["さ","xa","sa"],["し","xi*","shi"],["す","xư","su"],["せ","xê","se"],["そ","xô","so"]],
 [["た","ta","ta"],["ち","chi*","chi"],["つ","tsư*","tsu"],["て","tê","te"],["と","tô","to"]],

function morae(t){const out=[];for(const ch of t){if(/[ぁぃぅぇぉゃゅょゎァィゥェォャュョヮ]/.test(ch)&&out.length&&out[out.length-1]!==" ")out[out.length-1]+=ch;else out.push(ch)}return out}
function accHTML(t,pat){
  if(!pat)return t;
  /* each space-separated word stays on one line; lines break only at the space */
  const m=morae(t);let i=0,prev=null,h="",w="";
  const flush=()=>{if(w){h+=`<span class="aw">${w}</span>`;w=""}};
  for(const x of m){
    if(x===" "){flush();prev=null;continue}
    const p=pat[i++]||"L";const turn=prev&&prev!==p?" turn":"";
    w+=`<span class="mo ${p==="H"?"hi":"lo"}${turn}">${x}</span>`;prev=p;
  }
  flush();
  return `<span class="acc">${h}</span>`;
}

const NOTES={
en:{lbl:["How to say it","Watch out","Practice"],pal:"Before い the middle of the tongue rises toward the hard palate, so the consonant is softened [ʲ].",
 a:["Open central unrounded vowel","Open the mouth wide and keep the tongue low and relaxed.","Keep it short and clear; do not add a glide at the end."],

 nn:["Moraic nasal, one full beat (this card: before m, b, p)","It takes one beat by itself. Before m, b or p the lips close as in the picture; before n, t or d the tongue touches behind the upper teeth; before k or g it is made at the back of the mouth; at the end of a word it is made at the very back [ɴ].","Give it its full length; do not drop it."],
 k:["Voiceless velar plosive","Press the back of the tongue against the soft palate (red circle), stop the air, then release it.","The vocal cords do not vibrate. A light puff of air is fine."],
 g:["Voiced velar plosive","Same tongue position as か, but the vocal cords vibrate.","Keep the voicing from the start so it does not sound like か."],
 s:["Voiceless alveolar fricative","Bring the tongue tip close to the ridge behind the upper teeth and let the air hiss through the narrow gap.","The tongue does not touch; there is no stop."],
 shi:["Voiceless alveolo-palatal fricative","Raise the front of the tongue toward the area just behind the gum ridge; the air passes through a wider, softer gap than for す.","Softer than English “sh”, and the lips are not rounded."],
 z:["Voiced alveolar affricate (often [z] between vowels)","Touch the tongue tip to the gum ridge just behind the upper teeth, then release it into a buzzing “z” with the vocal cords vibrating.","Keep ざ・ず・ぜ・ぞ apart from じゃ・じゅ・じょ and from や・ゆ・よ. づ sounds the same as ず."],
 ji:["Voiced alveolo-palatal affricate (often [ʑ] between vowels)","Same place as し, with a short contact before the friction; the vocal cords vibrate. ぢ sounds the same as じ.","Do not let it turn into や or ざ."],
 t:["Voiceless alveolar plosive","Press the tongue tip against the back of the upper teeth and gum ridge, stop the air, then release.","Only た・て・と use [t]; ち and つ are different sounds."],
 chi:["Voiceless alveolo-palatal affricate","Press the front of the tongue just behind the gum ridge, then release it softly into a し-like sound.","A light release without a strong puff of air."],
 tsu:["Voiceless alveolar affricate","Start with the tongue tip touching the gum ridge just behind the upper teeth as for t, then release straight into す.","It is neither ちゅ nor す."],
 d:["Voiced alveolar plosive","Same tongue position as た, but the vocal cords vibrate.","Keep the voicing so that だ does not sound like た."],
 n:["Alveolar nasal","Touch the tongue tip to the gum ridge just behind the upper teeth and let the air out through the nose.","Air goes through the nose, so it must not sound like ら."],
 ni:["Palatal nasal","Press the middle of the tongue against the hard palate, a little further back than for な, and let the air out through the nose.","Do not say it with the tongue tip as in な."],
 h:["Voiceless glottal fricative","The air passes freely; the narrowing is between the vocal folds (circle in the picture).","Only soft breath, not a harsh scraping sound."],
 hi:["Voiceless palatal fricative","Raise the middle of the tongue close to the hard palate and let the air rub through the gap.","It is neither the h of は nor し."],
 fu:["Voiceless bilabial fricative","Bring both lips close together and blow gently between them.","The upper teeth do not touch the lower lip; it is not English f."],
 m:["Bilabial nasal","Close both lips and let the air out through the nose.","Keep the lips fully closed until the vowel starts."],
 b:["Voiced bilabial plosive","Close both lips, let the vocal cords vibrate, then open the lips.","Keep the voicing so it does not sound like ぱ."],
 p:["Voiceless bilabial plosive","Close both lips, stop the air, then release it.","No voicing; do not let it turn into ば."],
 y:["Voiced palatal approximant","Raise the middle of the tongue toward the hard palate without touching it, then glide into the vowel.","No friction or buzz; it must not sound like じゃ or ざ."],
 r:["Voiced alveolar flap","Tap the tongue tip once, lightly and quickly, on the ridge behind the upper teeth.","Not rolled, not English r, and not a long l."],
 w:["Voiced labial-velar approximant","Raise the back of the tongue and bring the lips a little closer, then glide into あ.","Do not round or push the lips forward strongly."]},

 i:["สระหน้า ปิด","ยิ้มริมฝีปากเล็กน้อย ยกลิ้นส่วนหน้าขึ้นใกล้เพดานแข็ง","ไม่ห่อปาก"],
 u:["สระหลัง ปิด ไม่ห่อปาก","ริมฝีปากผ่อนคลายเกือบแบน ยกลิ้นส่วนหลังขึ้น ใกล้กับเสียง อึ","ไม่ห่อปากยื่นออกไปเหมือน อุ"],
 e:["สระหน้า ระดับกลาง","อ้าปากน้อยกว่า あ เล็กน้อย ลิ้นอยู่ตรงกลางค่อนไปข้างหน้า ใกล้กับ เอะ","เป็นสระเดี่ยว ไม่เปลี่ยนเป็น เอย"],
 o:["สระหลัง ระดับกลาง ห่อปาก","ห่อปากเล็กน้อย ยกลิ้นส่วนหลังขึ้นครึ่งหนึ่ง ใกล้กับ โอะ","เป็นสระเดี่ยว ไม่เปลี่ยนเป็น โอว"],
 nn:["เสียงนาสิกที่นับเป็นหนึ่งจังหวะ (ภาพนี้: ก่อน m, b, p)","ยาวหนึ่งจังหวะด้วยตัวเอง ก่อน m, b, p ริมฝีปากปิดเหมือนในภาพ ก่อน n, t, d ปลายลิ้นแตะหลังฟันบน ก่อน k, g เสียงเกิดที่ด้านในปาก และท้ายคำเสียงเกิดที่ลึกสุดของปาก [ɴ]","ออกเสียงให้ครบหนึ่งจังหวะ อย่าตัดทิ้ง"],
 k:["เสียงกักไม่ก้อง ที่เพดานอ่อน","ยกลิ้นส่วนหลังแตะเพดานอ่อน (วงกลมแดง) กักลมไว้แล้วปล่อยออก","เส้นเสียงไม่สั่น จะมีลมพ่นเบา ๆ ก็ได้ (ระหว่าง ก กับ ค)"],
 g:["เสียงกักก้อง ที่เพดานอ่อน","ตำแหน่งลิ้นเหมือน か แต่เส้นเสียงสั่น","ภาษาไทยไม่มีเสียงนี้ อย่าออกเป็น ก หรือ ค ให้เส้นเสียงสั่นตั้งแต่ต้น"],
 s:["เสียงเสียดแทรกไม่ก้อง ที่ปุ่มเหงือก","ยกปลายลิ้นเข้าใกล้ปุ่มเหงือกหลังฟันบน ให้ลมเสียดผ่านช่องแคบ","ลิ้นไม่แตะ ไม่มีการกักลม"],
 shi:["เสียงเสียดแทรกไม่ก้อง ที่หลังปุ่มเหงือก–เพดานแข็ง","ยกลิ้นส่วนหน้าไปทางหลังปุ่มเหงือก ช่องลมกว้างและนุ่มกว่า す","เป็นเสียงลมนุ่ม ๆ ลิ้นไม่แตะเหมือนเสียง ช และไม่ห่อปาก"],
 z:["เสียงกักเสียดแทรกก้อง ที่ปุ่มเหงือก (กลางคำมักเป็น [z])","แตะปลายลิ้นที่ปุ่มเหงือกหลังฟันบนแล้วปล่อยเป็นเสียง ซ ที่เส้นเสียงสั่น","ภาษาไทยไม่มีเสียงนี้ อย่าออกเป็น ซ หรือ จ แยก ざ・ず・ぜ・ぞ ให้ต่างจาก じゃ・じゅ・じょ และ や・ゆ・よ づ ออกเสียงเหมือน ず"],
 ji:["เสียงกักเสียดแทรกก้อง ที่หลังปุ่มเหงือก–เพดานแข็ง (กลางคำมักเป็น [ʑ])","ตำแหน่งเดียวกับ し แตะสั้น ๆ ก่อนเสียดแทรก เส้นเสียงสั่น ぢ ออกเสียงเหมือน じ","อย่าออกเป็น จ หรือ ช และอย่าเปลี่ยนเป็น や หรือ ざ"],
 t:["เสียงกักไม่ก้อง ที่ปุ่มเหงือก","กดปลายลิ้นที่หลังฟันบนและปุ่มเหงือก กักลมแล้วปล่อย","มีเพียง た・て・と ที่ใช้ [t] ส่วน ち และ つ เป็นเสียงอื่น"],
 chi:["เสียงกักเสียดแทรกไม่ก้อง ที่หลังปุ่มเหงือก–เพดานแข็ง","แตะลิ้นส่วนหน้าที่หลังปุ่มเหงือก แล้วปล่อยเบา ๆ เป็นเสียงคล้าย し ใกล้กับ จิ","ปล่อยเบา ๆ ไม่พ่นลมแรงแบบ ชิ"],
 tsu:["เสียงกักเสียดแทรกไม่ก้อง ที่ปุ่มเหงือก","เริ่มด้วยปลายลิ้นแตะปุ่มเหงือกหลังฟันบนเหมือน t แล้วปล่อยเป็น す ทันที","ภาษาไทยไม่มีเสียงนี้ ไม่ใช่ ซึ หรือ จึ"],
 d:["เสียงกักก้อง ที่ปุ่มเหงือก","ตำแหน่งลิ้นเหมือน た แต่เส้นเสียงสั่น ใกล้กับ ด","ให้เส้นเสียงสั่นเพื่อไม่ให้ だ ฟังเป็น た"],
 n:["เสียงนาสิก ที่ปุ่มเหงือก","แตะปลายลิ้นที่ปุ่มเหงือกหลังฟันบน ให้ลมออกทางจมูก","ลมต้องออกทางจมูก ไม่ให้ฟังเป็น ら"],
 ni:["เสียงนาสิก ที่เพดานแข็ง","แตะลิ้นส่วนกลางกับเพดานแข็ง ลึกกว่า な เล็กน้อย ให้ลมออกทางจมูก","ไม่ใช้ปลายลิ้นเหมือน な"],
 h:["เสียงเสียดแทรกไม่ก้อง ที่เส้นเสียง","ลมผ่านออกได้สะดวก จุดที่แคบอยู่ที่เส้นเสียง (วงกลมในภาพ)","เป็นเพียงลมหายใจเบา ๆ ไม่ใช่เสียงขูด"],
 hi:["เสียงเสียดแทรกไม่ก้อง ที่เพดานแข็ง","ยกลิ้นส่วนกลางเข้าใกล้เพดานแข็ง ให้ลมเสียดผ่านช่องแคบ","ไม่ใช่ h ของ は และไม่ใช่ し"],
 fu:["เสียงเสียดแทรกไม่ก้อง ที่ริมฝีปากทั้งสอง","เม้มริมฝีปากเข้าหากันเล็กน้อย แล้วเป่าลมเบา ๆ ระหว่างริมฝีปาก","ฟันบนไม่แตะริมฝีปากล่าง ไม่ใช่ ฟ"],
 m:["เสียงนาสิก ที่ริมฝีปากทั้งสอง","ปิดริมฝีปาก ให้ลมออกทางจมูก","ปิดริมฝีปากสนิทจนกว่าจะเริ่มสระ"],
 b:["เสียงกักก้อง ที่ริมฝีปากทั้งสอง","ปิดริมฝีปาก ให้เส้นเสียงสั่น แล้วเปิดปาก","ให้เส้นเสียงสั่นเพื่อไม่ให้ฟังเป็น ぱ"],
 p:["เสียงกักไม่ก้อง ที่ริมฝีปากทั้งสอง","ปิดริมฝีปาก กักลมแล้วปล่อย (ระหว่าง ป กับ พ)","เส้นเสียงไม่สั่น อย่าเปลี่ยนเป็น ば"],
 y:["เสียงเปิดก้อง (กึ่งสระ) ที่เพดานแข็ง","ยกลิ้นส่วนกลางเข้าใกล้เพดานแข็งโดยไม่แตะ แล้วเลื่อนไปที่สระ","ไม่มีเสียงเสียดหรือการแตะ ไม่ให้ฟังเป็น じゃ หรือ ざ"],
 r:["เสียงลิ้นกระทบก้อง ที่ปุ่มเหงือก","ตวัดปลายลิ้นแตะปุ่มเหงือกหลังฟันบนครั้งเดียว เบาและเร็ว","ไม่รัวลิ้น ไม่ม้วนลิ้น และอย่าเปลี่ยนเป็น ล"],
 w:["เสียงเปิดก้อง (กึ่งสระ) ที่ริมฝีปาก–เพดานอ่อน","ยกลิ้นส่วนหลัง ริมฝีปากเข้าใกล้กันเล็กน้อย แล้วเลื่อนไปที่ あ","ไม่ห่อหรือยื่นริมฝีปากมาก"]},

ms:{lbl:["Cara menyebut","Perhatian","Latihan"],pal:"Sebelum い, bahagian tengah lidah naik ke arah lelangit keras, jadi konsonan menjadi lembut [ʲ].",
 a:["Vokal tengah terbuka tanpa bundaran","Buka mulut luas dan biarkan lidah rendah dan santai.","Sebut pendek dan jelas; jangan tambah bunyi luncuran di hujung."],
 i:["Vokal depan sempit","Tarik bibir sedikit ke tepi dan naikkan bahagian depan lidah dekat lelangit keras.","Jangan bundarkan bibir."],
 u:["Vokal belakang sempit tanpa bundaran","Bibir santai hampir rata, naikkan bahagian belakang lidah.","Jangan muncungkan bibir seperti “u” Melayu."],
 e:["Vokal depan separuh sempit","Buka mulut kurang sedikit daripada あ; lidah di tengah depan.","Vokal tunggal: jangan jadikan “ei”."],
 o:["Vokal belakang separuh sempit, bundar","Bundarkan bibir sedikit dan naikkan bahagian belakang lidah separuh.","Vokal tunggal: jangan jadikan “ou”."],
 nn:["Bunyi sengau satu ketukan (kad ini: sebelum m, b, p)","Ia mengambil satu ketukan sendiri. Sebelum m, b, p bibir tertutup seperti dalam gambar; sebelum n, t, d hujung lidah menyentuh belakang gigi atas; sebelum k, g bunyi dibuat di bahagian belakang mulut; di hujung perkataan ia dibuat paling belakang [ɴ].","Sebut sepanjang satu ketukan; jangan digugurkan."],
 k:["Letupan velar tak bersuara","Tekan bahagian belakang lidah pada lelangit lembut (bulatan merah), tahan udara, kemudian lepaskan.","Pita suara tidak bergetar. Hembusan udara yang ringan tidak mengapa."],
 g:["Letupan velar bersuara","Kedudukan lidah sama seperti か, tetapi pita suara bergetar.","Getarkan pita suara dari awal supaya tidak kedengaran seperti か."],
 s:["Geseran alveolar tak bersuara","Dekatkan hujung lidah pada gusi di belakang gigi atas dan biarkan udara berdesir melalui celah sempit.","Lidah tidak menyentuh; tiada hentian."],
 shi:["Geseran alveolo-palatal tak bersuara","Naikkan bahagian depan lidah ke arah belakang gusi; celah udara lebih luas dan lembut daripada す. Hampir seperti “sy”.","Lebih lembut daripada “sy”, dan bibir tidak dibundarkan."],
 z:["Letusan-geseran alveolar bersuara (di tengah perkataan sering [z])","Sentuh hujung lidah pada gusi tepat di belakang gigi atas, kemudian lepaskan menjadi bunyi “z” dengan pita suara bergetar.","Bezakan ざ・ず・ぜ・ぞ daripada じゃ・じゅ・じょ dan や・ゆ・よ. づ disebut sama seperti ず."],
 ji:["Letusan-geseran alveolo-palatal bersuara (di tengah perkataan sering [ʑ])","Kedudukan sama seperti し, dengan sentuhan pendek sebelum geseran; pita suara bergetar. Hampir seperti “j” yang lembut. ぢ disebut sama seperti じ.","Jangan biarkan ia berubah menjadi や atau ざ."],
 t:["Letupan alveolar tak bersuara","Tekan hujung lidah pada belakang gigi atas dan gusi, tahan udara, kemudian lepaskan.","Hanya た・て・と menggunakan [t]; ち dan つ ialah bunyi lain."],
 chi:["Letusan-geseran alveolo-palatal tak bersuara","Tekan bahagian depan lidah di belakang gusi, kemudian lepaskan perlahan menjadi bunyi seperti し. Hampir seperti “ci”.","Lepaskan dengan ringan tanpa hembusan udara yang kuat."],
 tsu:["Letusan-geseran alveolar tak bersuara","Mula dengan hujung lidah menyentuh gusi tepat di belakang gigi atas seperti t, kemudian terus lepaskan menjadi す.","Bukan “cu” dan bukan “su”."],
 d:["Letupan alveolar bersuara","Kedudukan lidah sama seperti た, tetapi pita suara bergetar.","Kekalkan getaran supaya だ tidak kedengaran seperti た."],
 n:["Sengau alveolar","Sentuh hujung lidah pada gusi tepat di belakang gigi atas dan biarkan udara keluar melalui hidung.","Udara keluar melalui hidung, jadi jangan sampai kedengaran seperti ら."],
 ni:["Sengau palatal","Tekan bahagian tengah lidah pada lelangit keras, sedikit ke dalam berbanding な, dan biarkan udara keluar melalui hidung. Hampir seperti “nya”.","Jangan gunakan hujung lidah seperti な."],
 h:["Geseran glotis tak bersuara","Udara keluar dengan bebas; penyempitan berlaku di antara pita suara (bulatan dalam gambar).","Hanya hembusan nafas yang lembut, bukan bunyi kasar."],
 hi:["Geseran palatal tak bersuara","Dekatkan bahagian tengah lidah pada lelangit keras dan biarkan udara bergeser melalui celah.","Bukan “h” dalam は dan bukan し."],
 fu:["Geseran dua bibir tak bersuara","Rapatkan kedua-dua bibir sedikit dan hembus perlahan di antaranya.","Gigi atas tidak menyentuh bibir bawah; ini bukan “f”."],
 m:["Sengau dua bibir","Tutup kedua-dua bibir dan biarkan udara keluar melalui hidung.","Tutup bibir rapat sehingga vokal bermula."],
 b:["Letupan dua bibir bersuara","Tutup kedua-dua bibir, getarkan pita suara, kemudian buka bibir.","Kekalkan getaran supaya tidak kedengaran seperti ぱ."],
 p:["Letupan dua bibir tak bersuara","Tutup kedua-dua bibir, tahan udara, kemudian lepaskan.","Tiada getaran; jangan jadikan ば."],
 y:["Separuh vokal palatal bersuara","Naikkan bahagian tengah lidah ke arah lelangit keras tanpa menyentuh, kemudian luncur ke vokal.","Tiada geseran; jangan sampai kedengaran seperti じゃ atau ざ."],
 r:["Bunyi kepak alveolar bersuara","Ketuk hujung lidah sekali, ringan dan cepat, pada gusi di belakang gigi atas.","Jangan getarkan lidah seperti “r” Melayu, dan bukan “l” yang panjang."],
 w:["Separuh vokal bibir-velar bersuara","Naikkan bahagian belakang lidah dan rapatkan bibir sedikit, kemudian luncur ke あ.","Jangan bundarkan atau muncungkan bibir dengan kuat."]},

id:{lbl:["Cara mengucapkan","Perhatian","Latihan"],pal:"Sebelum い, bagian tengah lidah naik ke arah langit-langit keras, sehingga konsonan menjadi lunak [ʲ].",
 a:["Vokal tengah terbuka tanpa pembulatan","Buka mulut lebar dan biarkan lidah rendah dan rileks.","Ucapkan pendek dan jelas; jangan tambahkan bunyi luncuran di akhir."],
 i:["Vokal depan tertutup","Tarik bibir sedikit ke samping dan naikkan bagian depan lidah mendekati langit-langit keras.","Jangan bulatkan bibir."],
 u:["Vokal belakang tertutup tanpa pembulatan","Bibir rileks hampir datar, naikkan bagian belakang lidah.","Jangan memonyongkan bibir seperti “u” bahasa Indonesia."],
 e:["Vokal depan setengah tertutup","Buka mulut sedikit lebih kecil daripada あ; lidah di tengah depan.","Vokal tunggal: jangan menjadi “ei”."],
 o:["Vokal belakang setengah tertutup, bulat","Bulatkan bibir sedikit dan naikkan bagian belakang lidah setengah.","Vokal tunggal: jangan menjadi “ou”."],
 nn:["Bunyi nasal satu ketukan (kartu ini: sebelum m, b, p)","Bunyi ini mengambil satu ketukan sendiri. Sebelum m, b, p bibir tertutup seperti pada gambar; sebelum n, t, d ujung lidah menyentuh belakang gigi atas; sebelum k, g bunyi dibuat di bagian belakang mulut; di akhir kata bunyi dibuat paling belakang [ɴ].","Ucapkan selama satu ketukan penuh; jangan dihilangkan."],
 k:["Bunyi letup velar tak bersuara","Tempelkan bagian belakang lidah ke langit-langit lunak (lingkaran merah), tahan udara, lalu lepaskan.","Pita suara tidak bergetar. Embusan napas yang ringan tidak apa-apa."],
 g:["Bunyi letup velar bersuara","Posisi lidah sama dengan か, tetapi pita suara bergetar.","Getarkan pita suara sejak awal agar tidak terdengar seperti か."],
 s:["Bunyi frikatif alveolar tak bersuara","Dekatkan ujung lidah ke gusi di belakang gigi atas dan biarkan udara berdesis melalui celah sempit.","Lidah tidak menyentuh; tidak ada hambatan."],
 shi:["Bunyi frikatif alveolo-palatal tak bersuara","Naikkan bagian depan lidah ke arah belakang gusi; celah udara lebih lebar dan lembut daripada す. Mirip “sy”.","Lebih lembut daripada “sy”, dan bibir tidak dibulatkan."],
 z:["Bunyi afrikat alveolar bersuara (di tengah kata sering [z])","Sentuhkan ujung lidah ke gusi tepat di belakang gigi atas, lalu lepaskan menjadi bunyi “z” dengan pita suara bergetar.","Bedakan ざ・ず・ぜ・ぞ dari じゃ・じゅ・じょ dan や・ゆ・よ. づ diucapkan sama seperti ず."],
 ji:["Bunyi afrikat alveolo-palatal bersuara (di tengah kata sering [ʑ])","Posisi sama dengan し, dengan sentuhan singkat sebelum gesekan; pita suara bergetar. Mirip “j” yang lembut. ぢ diucapkan sama seperti じ.","Jangan sampai berubah menjadi や atau ざ."],
 t:["Bunyi letup alveolar tak bersuara","Tempelkan ujung lidah ke belakang gigi atas dan gusi, tahan udara, lalu lepaskan.","Hanya た・て・と yang memakai [t]; ち dan つ adalah bunyi lain."],
 chi:["Bunyi afrikat alveolo-palatal tak bersuara","Tempelkan bagian depan lidah di belakang gusi, lalu lepaskan perlahan menjadi bunyi seperti し. Mirip “ci”.","Lepaskan dengan ringan tanpa embusan napas yang kuat."],
 tsu:["Bunyi afrikat alveolar tak bersuara","Mulai dengan ujung lidah menyentuh gusi tepat di belakang gigi atas seperti t, lalu langsung lepaskan menjadi す.","Bukan “cu” dan bukan “su”."],
 d:["Bunyi letup alveolar bersuara","Posisi lidah sama dengan た, tetapi pita suara bergetar.","Pertahankan getaran agar だ tidak terdengar seperti た."],
 n:["Bunyi nasal alveolar","Sentuhkan ujung lidah ke gusi tepat di belakang gigi atas dan biarkan udara keluar lewat hidung.","Udara keluar lewat hidung, jadi jangan sampai terdengar seperti ら."],
 ni:["Bunyi nasal palatal","Tempelkan bagian tengah lidah ke langit-langit keras, sedikit lebih ke dalam daripada な, dan biarkan udara keluar lewat hidung. Mirip “nya”.","Jangan memakai ujung lidah seperti な."],
 h:["Bunyi frikatif glotal tak bersuara","Udara keluar dengan bebas; penyempitan terjadi di antara pita suara (lingkaran pada gambar).","Hanya embusan napas yang lembut, bukan bunyi kasar."],
 hi:["Bunyi frikatif palatal tak bersuara","Dekatkan bagian tengah lidah ke langit-langit keras dan biarkan udara bergesek melalui celah.","Bukan “h” pada は dan bukan し."],
 fu:["Bunyi frikatif bilabial tak bersuara","Dekatkan kedua bibir dan embuskan napas pelan di antaranya.","Gigi atas tidak menyentuh bibir bawah; ini bukan “f”."],
 m:["Bunyi nasal bilabial","Tutup kedua bibir dan biarkan udara keluar lewat hidung.","Tutup bibir rapat sampai vokal dimulai."],
 b:["Bunyi letup bilabial bersuara","Tutup kedua bibir, getarkan pita suara, lalu buka bibir.","Pertahankan getaran agar tidak terdengar seperti ぱ."],

/* The notes name the あ-column kana (か, だ, や…); swap in the kana of the card being shown */
let ID2K=null;
function kanaOfId(id){
  if(!ID2K){ID2K={};for(const c of [...BASIC.rows.flat(),...DAKU.rows.flat()].filter(Boolean))ID2K[{"wo (o)":"wo","ji (di)":"di","zu (du)":"du"}[c[2]]||c[2].split(" ")[0]]=c[0]}
  return ID2K[id]||"";
}
const shiftK=(k,n)=>String.fromCharCode(k.charCodeAt(0)+n);
const toKataK=t=>t.replace(/[\u3041-\u3096]/g,c=>String.fromCharCode(c.charCodeAt(0)+0x60));
const VOWEL_OF={"や":"あ","ゆ":"う","よ":"お"};
/* replace a kana only where it stands alone (not inside a word such as すばやく) */
function swapLone(t,map){
  const isK=c=>!!c&&/[\u3040-\u30ff]/.test(c);
  return [...t].map((c,i,a)=>(map[c]&&!isK(a[i-1])&&!isK(a[i+1]))?map[c]:c).join("");
}
function fitKana(id,key,t){
  if(!t)return t;const S=kanaOfId(id);if(!S)return t;
  if(key==="g")return swapLone(t,{"か":shiftK(S,-1)});
  if(key==="d")return swapLone(t,{"だ":S,"た":shiftK(S,-1)});
  if(key==="b")return swapLone(t,{"ぱ":shiftK(S,1)});
  if(key==="p")return swapLone(t,{"ば":shiftK(S,-1)});
  if(key==="y"){const V=VOWEL_OF[S];return swapLone(t,{"あ":V,"や":S,"ア":toKataK(V),"ヤ":toKataK(S)})}
  return t;
}
function noteFor(id){
  const L=NOTES[LANG]||NOTES.en,key=NKEY[id];if(!key||!L[key])return "";
  const [ty,how0,warn0]=L[key],how=fitKana(id,key,how0),warn=fitKana(id,key,warn0);const ex=(EXTRA[LANG]||{})[id]||(EXTRA[LANG]||{})[key]||"";
  const pal=PAL.has(id)?" "+L.pal:"";
  return `<p class="ill-type"><b>[${IPA[id]||""}]</b> ${ty}</p>`+
    `<p><b>${L.lbl[0]}:</b> ${how}${pal}</p>`+
    `<p><b>${L.lbl[1]}:</b> ${warn}${ex?" "+ex:""}</p>`+
    (()=>{const P=PRAC[LANG]||PRAC.en,t=[fitKana(id,key,P[key]),VOICED.has(key)?P.voiced:""].filter(Boolean).join(" ");return t?`<p class="ill-prac"><b>${L.lbl[2]}:</b> ${t}</p>`:""})();
}

function score(v){
  const n=v.name.toLowerCase();let s=0;
  if(/natural|online|neural|premium|enhanced/.test(n))s+=50;
  if(/nanami|keita|aoi|mayu|shiori|naoki/.test(n))s+=25;
  if(/google/.test(n))s+=30;
  if(/kyoko|o-ren|otoya|hattori/.test(n))s+=20;
  if(/haruka|ayumi|ichiro|sayaka/.test(n))s+=5;
  return s;
}
/* Audio sources: rec = native-speaker recordings (audio/), ai = Google neural TTS files (audio/ai/), tts = device voice */
const SRC={rec:{dir:"audio/",set:null,label:"srcRec",opt:"optRec"},
           ai:{dir:"audio/ai/",set:null,label:"srcAI",opt:"optAI"}};
let mode="tts",curId="a";
function anyFiles(){return !!(SRC.rec.set||SRC.ai.set)}
function loadVoices(){
  const sel=document.getElementById("voice");
  voices=synth?synth.getVoices().filter(v=>/^ja([-_]|$)/i.test(v.lang)).sort((a,b)=>score(b)-score(a)):[];
  const saved=store.get("hira_voice",null);
  const nice=v=>v.name.replace(/Microsoft |Online |\(Natural\)| - Japanese \(Japan\)/g," ").replace(/\s+/g," ").trim();
  let h="";
  for(const k of ["rec","ai"])if(SRC[k].set)h+=`<option value="${k}">${T(SRC[k].opt)}</option>`;
  if(voices.length)h+='<optgroup label="'+T("grpTTS")+'">'+voices.map((v,i)=>`<option value="${i}">${nice(v)}</option>`).join("")+'</optgroup>';
  if(!h)h='<option>'+T("noVoice")+'</option>';
  sel.innerHTML=h;
  const vi=voices.findIndex(v=>v.name===saved);
  const gi=voices.findIndex(v=>/^Google/i.test(v.name)); /* Chrome's "Google 日本語" is the default when available */
  let ti=vi;
  if((saved==="rec"||saved==="ai")&&SRC[saved].set)mode=saved;
  else if(vi>=0&&saved!==null)mode="tts";
  else if(gi>=0){mode="tts";ti=gi}
  else mode=SRC.rec.set?"rec":SRC.ai.set?"ai":"tts";
  if(mode==="tts"){const i=Math.max(0,ti);if(voices.length)sel.value=i;voice=voices[i]||null}
  else{sel.value=mode;voice=voices[0]||null}
  if(!synth&&!anyFiles()){warn.hidden=false;warn.textContent=T("warnNoSynth");return}
  if(!voices.length&&!anyFiles()){
    warn.hidden=false;
    warn.textContent=T("warnNoJa");
    return;
  }
  warn.hidden=true;
  if(typeof setSrc==="function")setSrc(curId);
}
loadVoices();if(synth){synth.onvoiceschanged=loadVoices;setTimeout(loadVoices,800)}
document.getElementById("voice").addEventListener("change",e=>{
  const v=e.target.value;
  if(v==="rec"||v==="ai"){mode=v;voice=voices[0]||null;store.set("hira_voice",v)}
  else{mode="tts";voice=voices[+v];store.set("hira_voice",voice&&voice.name)}

function utter(text){
  const u=new SpeechSynthesisUtterance(text);
  u.lang="ja-JP";if(voice)u.voice=voice;u.rate=rate;u.pitch=1;return u;
}
/* Recorded audio (audio/manifest.json) is preferred; speech synthesis is the fallback */
let tok=0;
const player=new Audio();player.preload="auto";
for(const k of ["rec","ai"]){try{fetch(SRC[k].dir+"manifest.json",{cache:"no-cache"}).then(r=>r.ok?r.json():null).then(j=>{if(j&&Array.isArray(j.files)){SRC[k].set=new Set(j.files);loadVoices();setSrc(curId)}}).catch(()=>{})}catch(e){}}
function idOf(cell){return cell[2]==="wo (o)"?"o":cell[2].split(" ")[0]}
function hasRec(id){const m=SRC[mode];return !!(m&&m.set&&id&&m.set.has(id))}
function fileOf(id){return SRC[mode].dir+id+".mp3"}
function setSrc(id){const el=document.getElementById("src");if(el)el.textContent=anyFiles()?(hasRec(id)?T(SRC[mode].label):T("srcTTS")):""}
function ttsOnce(say){return new Promise(res=>{if(!synth)return res();const u=utter(say);u.onend=res;u.onerror=res;synth.speak(u)})}
function once(say,id){
  setSrc(id);
  if(!hasRec(id))return ttsOnce(say);
  return new Promise(res=>{
    player.onended=res;player.onerror=()=>ttsOnce(say).then(res);
    player.src=fileOf(id);
    try{player.preservesPitch=true}catch(e){}
    player.playbackRate=rate<0.7?0.75:1;
    const p=player.play();if(p&&p.catch)p.catch(()=>ttsOnce(say).then(res));
  });
}
function stopAll(){tok++;player.ontimeupdate=null;try{synth&&synth.cancel()}catch(e){}try{player.pause()}catch(e){}}
function speak(text,id){stopAll();curId=id||null;once(text,curId)}
function playRow(rid,items,onEach){
  stopAll();const t=tok;let last=0;
  onEach(items[0]);curId=items[0].id;setSrc(rid);
  player.onended=()=>{player.ontimeupdate=null};
  player.onerror=()=>{if(t===tok)speakSeq(items,onEach)};
  player.ontimeupdate=()=>{
    if(t!==tok)return;const d=player.duration;if(!d||!isFinite(d))return;
    const i=Math.min(items.length-1,Math.floor(player.currentTime/d*items.length));
    if(i!==last){last=i;onEach(items[i]);curId=items[i].id}
  };
  player.src=fileOf(rid);
  try{player.preservesPitch=true}catch(e){}
  player.playbackRate=rate<0.7?0.75:1;
  const p=player.play();if(p&&p.catch)p.catch(()=>{if(t===tok)speakSeq(items,onEach)});
}
async function speakSeq(items,onEach){
  stopAll();const t=tok;
  for(let i=0;i<items.length;i++){
    if(t!==tok)return;
    onEach&&onEach(items[i],i);curId=items[i].id;
    await once(items[i].say,items[i].id);
    if(t!==tok)return;
    await new Promise(r=>setTimeout(r,250));
  }
}

  grid.className="grid";grid.style.setProperty("--cols",d.cols.length);
  grid.appendChild(document.createElement("span"));
  d.cols.forEach(c=>{const h=document.createElement("div");h.className="colhead";h.textContent=c;grid.appendChild(h)});
  d.rows.forEach(row=>{
    const rp=document.createElement("button");
    rp.className="rowplay";rp.type="button";rp.innerHTML=ICON_PLAY;
    const first=row.find(Boolean);rp.setAttribute("aria-label",T("rowPlay")+" "+first[0]);rp.title=T("rowPlay");
    const btns=[];
    grid.appendChild(rp);
    row.forEach(cell=>{
      if(!cell){const e=document.createElement("div");e.className="empty";e.setAttribute("aria-hidden","true");grid.appendChild(e);btns.push(null);return}
      const [k,vi,ro]=cell;
      const b=document.createElement("button");
      b.type="button";b.className="k"+(heard.has(k)?" heard":"");
      const dk=K(k);
      b.setAttribute("aria-label",dk+" , "+ro);
      b.innerHTML=`<span class="kk" lang="ja">${dk}</span><span class="vi">${vi.replace("*",'<span class="star">*</span>')}</span><span class="ro">${ro}</span>`;
      b.addEventListener("click",()=>{markOn(b);lastCell=cell;show(dk,vi,ro);speak(dk,idOf(cell));hear(k);if(vis.ill&&illCur)openIll()});
      grid.appendChild(b);btns.push(b);
    });
    rp.addEventListener("click",()=>{
      const items=row.map((c,i)=>c&&{say:K(c[0]),id:idOf(c),c,b:btns[i]}).filter(Boolean);
      const each=it=>{markOn(it.b);lastCell=it.c;show(K(it.c[0]),it.c[1],it.c[2]);hear(it.c[0])};
      const rid="row-"+idOf(first);
      if(hasRec(rid))playRow(rid,items,each);else speakSeq(items,each);
    });
  });
  return grid;
}
function renderSpecial(){
  const wrap=document.createElement("div");wrap.className="special";
  const head=document.createElement("p");head.className="sp-head";
  head.innerHTML=accHTML("コーヒー","LHHL")+'<span>'+T("accLegend")+'</span>';
  wrap.appendChild(head);
  (script==="kata"?SPECIAL_KATA:SPECIAL).forEach(s=>{
    const el=document.createElement("div");el.className="sp";
    const [title,text]=T("sp")[s.key];const mark=s.mark||T("marks")[s.key];
    el.innerHTML=`<div class="mark" lang="ja">${mark}</div><div><p><b>${title}.</b> ${text}</p><div class="ex"></div></div>`;
    const ex=el.querySelector(".ex");
    s.ex.forEach(wid=>{const jp=WORD[wid],vi=meanOf(wid);
      const c=document.createElement("button");c.type="button";c.className="chip";
      c.innerHTML=`<span class="jp" lang="ja">${accHTML(jp,ACC[wid])}</span><small>${vi}</small>`;
      c.addEventListener("click",()=>{const say=SAYW[wid]||jp;lastCell=null;show(jp,vi,wid.slice(2).replace(/-/g," "),say,title,true);big.innerHTML=accHTML(jp,ACC[wid]);speak(say,wid)});
      ex.appendChild(c);
    });
    wrap.appendChild(el);
  });
  return wrap;
}
function select(id){
  const g=GROUPS.find(x=>x.id===id)||GROUPS[0];current=g;
  panel.style.setProperty("--c",`var(${g.c})`);panel.style.setProperty("--soft",`var(${g.s})`);
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",t.dataset.id===g.id));
  panel.innerHTML="";
  if(g.id==="gairai"){const n=document.createElement("p");n.className="gnote";n.innerHTML=T("gairaiNote");panel.appendChild(n)}
  panel.appendChild(g.id==="special"?renderSpecial():renderGrid(g));
  store.set("hira_tab",g.id);
}
const tabs=document.getElementById("tabs");
GROUPS.forEach(g=>{
  const t=document.createElement("button");t.className="tab";t.type="button";t.role="tab";t.dataset.id=g.id;
  t.style.setProperty("--c",`var(${g.c})`);
  t.innerHTML=`<span class="jp" lang="ja" data-raw="${g.jp}">${K(g.jp)}</span><span class="tl"></span>`;
  t.addEventListener("click",()=>select(g.id));tabs.appendChild(t);
});

/* ---------- Toggles ---------- */
document.querySelectorAll("#speed button").forEach(b=>{
  b.setAttribute("aria-pressed",String(+b.dataset.rate===rate));
  b.addEventListener("click",()=>{rate=+b.dataset.rate;store.set("hira_rate",rate);
    document.querySelectorAll("#speed button").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));speak(big.dataset.say||"あ",curId)});
});
const vis=Object.assign({vi:true,ro:true,ill:true},store.get("hira_vis",{})); /* ill: open the illustration card automatically (default on) */
function applyVis(){
  const hb=document.querySelector('#show [data-k="vi"]');if(hb)hb.hidden=LANG!=="vi";
  panel.classList.toggle("hide-vi",LANG!=="vi"||!vis.vi);panel.classList.toggle("hide-ro",!vis.ro);
  document.querySelectorAll("#show button").forEach(b=>b.setAttribute("aria-pressed",String(vis[b.dataset.k])));
}
document.querySelectorAll("#show button").forEach(b=>b.addEventListener("click",()=>{vis[b.dataset.k]=!vis[b.dataset.k];store.set("hira_vis",vis);applyVis()}));

function applyScript(){
  document.querySelectorAll("#script button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.s===script)));
  document.getElementById("h1jp").textContent=script==="kata"?"カタカナ":"ひらがな";
  document.querySelectorAll(".tab .jp").forEach(el=>el.textContent=K(el.dataset.raw));
  select(current?current.id:store.get("hira_tab","basic"));applyVis();
  const c=lastCell||BASIC.rows[0][0];lastCell=c;show(K(c[0]),c[1],c[2]);curId=idOf(c);setSrc(curId);
}
document.querySelectorAll("#script button").forEach(b=>b.addEventListener("click",()=>{
  script=b.dataset.s;store.set("hira_script",script);applyScript();speak(big.dataset.say,curId);
}));
function applyLang(){
  document.documentElement.lang=LANG;document.title=T("title");
  document.querySelectorAll("[data-i18n]").forEach(el=>{const v=T(el.dataset.i18n);if(typeof v==="string")el.textContent=v});
  document.getElementById("h1t").textContent=T("h1");document.getElementById("sub").textContent=T("sub");
  document.getElementById("notes").innerHTML=T("notes").map(([h,p])=>`<div class="note"><h3>${h}</h3><p>${p}</p></div>`).join("");
  document.querySelectorAll(".tab").forEach(t=>t.querySelector(".tl").textContent=T("tabs")[t.dataset.id]);
  document.getElementById("lang").value=LANG;
  loadVoices();updateProgress();applyScript();updateIllBtn();
  if(document.getElementById("ill").open)fillIllNote();
}
const langSel=document.getElementById("lang");
langSel.innerHTML=LANGS.map(([c,n])=>`<option value="${c}" lang="${c}">${n}</option>`).join("");
langSel.addEventListener("change",()=>{LANG=langSel.value;store.set("hira_lang",LANG);try{history.replaceState(null,"","#"+LANG)}catch(e){}applyLang()});
applyLang();
</script>
